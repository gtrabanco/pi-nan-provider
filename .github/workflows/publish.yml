name: Publish

# Permite activar la publicación de forma manual desde la pestaña "Actions" en GitHub
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write # 👈 Obligatorio para Trusted Publishing sin contraseñas (OIDC)

jobs:
  publish:
    if: github.repository == 'gtrabanco/pi-nan-provider'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate model catalog
        run: bun run generate-models

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Publish if version changed
        run: |
          PACKAGE_NAME=$(bun -e "console.log(require('./package.json').name)")
          LOCAL_VERSION=$(bun -e "console.log(require('./package.json').version)")
          
          # Consultamos el registro usando bunx npm
          PUBLISHED_VERSION=$(bunx npm view "$PACKAGE_NAME" version 2>/dev/null || echo "unpublished")
          
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Version $LOCAL_VERSION already published — skipping."
            exit 0
          fi
          
          echo "Publishing $PACKAGE_NAME@$LOCAL_VERSION (registry has $PUBLISHED_VERSION)..."
          
          # Publicamos usando el CLI de npm a través de bunx para usar OIDC nativo
          bunx npm@latest publish --access public
          
          # Crear tag de Git de forma local y subirlo
          git tag "v$LOCAL_VERSION"
          git push origin "v$LOCAL_VERSION"
