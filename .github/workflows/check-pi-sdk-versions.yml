name: PI SDK Version Check

on:
  schedule:
    # Check every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      check-mode:
        description: "Check mode"
        required: false
        default: "report"
        type: choice
        options:
          - report
          - fail

permissions:
  contents: read
  issues: write

jobs:
  check-pi-sdk-versions:
    name: Check PI SDK versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check PI SDK versions (report)
        id: check-report
        run: |
          set -euo pipefail
          node scripts/check-pi-sdk-versions.mjs --report 2>&1 || true

      - name: Check PI SDK versions (CI JSON)
        run: |
          set -euo pipefail
          node scripts/check-pi-sdk-versions.mjs

      - name: Create/update issue on breaking change
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `## PI SDK version check detected updates

            The weekly PI SDK version check found updates that may require attention:

            ### Affected packages

            The following packages have version bumps available:

            - \`@earendil-works/pi-ai\`
            - \`@earendil-works/pi-coding-agent\`

            ### Next steps
            1. Review the changelog / release notes for the affected packages
            2. Check if the new versions affect pi-nan-provider (API changes, new dependencies, etc.)
            3. Update devDependencies and run \`bun test\` to verify
            4. Update peerDependencies range if needed

            ## Previous run output

            <details><summary>Click to view</summary>

            \`\`\`
            See CI logs for full output
            \`\`\`

            </details>`;

            const title = 'PI SDK version check: updates available';

            // Check if a similar issue already exists
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sdk-monitor',
            });

            if (existing.data.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: body,
              });
              console.log(`Updated existing issue #${existing.data[0].number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['sdk-monitor', 'dependencies'],
              });
            }
